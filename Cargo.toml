[package]
name = "todo-md-rs"
version = "0.1.0"
edition = "2021"
description = "cli todo tool to interact with markdown files"
[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
chrono = "0.4.31"
clap = { version = "4.5.3", features = ["derive"] }
colored = "2.1.0"
dirs = "5.0.1"
regex = "1.10.2"
serde = { version = "1.0.189", features = ["derive"] }
toml = "0.8.6"
